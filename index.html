    const qaListEl = document.getElementById("qaList");
    const searchInputEl = document.getElementById("searchInput");
    const searchBtnEl = document.getElementById("searchBtn");
    const clearBtnEl = document.getElementById("clearBtn");
    const resultCountEl = document.getElementById("resultCount");
    const emptyStateEl = document.getElementById("emptyState");

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeRegExp(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function highlightText(rawText, query) {
      const escaped = escapeHtml(rawText);
      const trimmed = query.trim();
      if (!trimmed) return escaped;

      const terms = trimmed.split(/\s+/).filter(Boolean).map(escapeRegExp);
      if (terms.length === 0) return escaped;

      const regex = new RegExp(`(${terms.join("|")})`, "gi");
      return escaped.replace(regex, "<mark>$1</mark>");
    }

    function renderCards(query = "") {
      const trimmedQuery = query.trim();
      const terms = trimmedQuery.toLowerCase().split(/\s+/).filter(Boolean);

      qaListEl.innerHTML = "";
      let visibleCount = 0;

      QA_DATA.forEach((item) => {
        const searchableBlob = [
          item.num,
          item.topic,
          item.question,
          ...(item.options || []),
          item.answer,
          item.explanation
        ]
          .join(" ")
          .toLowerCase();

        const matches = terms.every((term) => searchableBlob.includes(term));
        if (!matches) return;

        visibleCount += 1;

        const card = document.createElement("article");
        card.className = "qa-card";

        const optionsHtml =
          item.options && item.options.length > 0
            ? `<ul class="options-list">${item.options
                .map((opt) => `<li>${highlightText(opt, trimmedQuery)}</li>`)
                .join("")}</ul>`
            : "";

        card.innerHTML = `
          <div class="qa-meta">
            <span class="q-num">Question #${highlightText(item.num, trimmedQuery)}</span>
            <span class="topic-badge">${highlightText(item.topic, trimmedQuery)}</span>
          </div>
          <div class="question-text">${highlightText(item.question, trimmedQuery)}</div>
          ${optionsHtml}
          <div class="answer-box">${highlightText(item.answer, trimmedQuery)}</div>
          <div class="explanation-box">
            <span class="explanation-label">Explanation</span>
            ${highlightText(item.explanation, trimmedQuery)}
          </div>
        `;

        qaListEl.appendChild(card);
      });

      if (!trimmedQuery) {
        resultCountEl.textContent = `Showing all ${visibleCount} questions`;
      } else {
        resultCountEl.textContent = `Found ${visibleCount} matching question${visibleCount === 1 ? "" : "s"} for "${trimmedQuery}"`;
      }

      emptyStateEl.classList.toggle("visible", visibleCount === 0);
    }

    searchInputEl.addEventListener("input", (e) => {
      renderCards(e.target.value);
    });

    searchBtnEl.addEventListener("click", () => {
      renderCards(searchInputEl.value);
      searchInputEl.focus();
    });

    searchInputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        renderCards(searchInputEl.value);
      }
    });

    clearBtnEl.addEventListener("click", () => {
      searchInputEl.value = "";
      renderCards("");
      searchInputEl.focus();
    });

    // Initial render: display all provided questions, options, answers, and explanations below the search bar
    renderCards("");
  </script>
